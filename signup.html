<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up · HuntSense</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-card">
  <h1>HuntSense</h1><h2>Create account</h2>
  <form id="signup-form">
    <label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" maxlength="80" required>
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Sign up</button>
  </form>
  <p id="message" class="message" role="status"></p><p>Already registered? <a href="login.html">Log in</a></p>
</main>
<script type="module">
  import { supabase } from "./supabase.js";
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.replace("index.html");
  document.getElementById("signup-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const values = new FormData(event.currentTarget);
    const button = event.currentTarget.querySelector("button");
    const message = document.getElementById("message");
    button.disabled = true; message.textContent = "Creating account…";
    const { data, error } = await supabase.auth.signUp({
      email: values.get("email"), password: values.get("password"),
      options: { data: { display_name: values.get("name") } }
    });
    button.disabled = false;
    if (error) message.textContent = error.message;
    else if (data.session) window.location.replace("index.html");
    else message.textContent = "Account created. Check your email to confirm, then log in.";
  });
</script></body></html>
