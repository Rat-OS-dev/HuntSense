<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account · HuntSense</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-card">
  <p><a href="index.html">← Home</a></p><h1>Your account</h1>
  <dl class="account-details"><dt>Name</dt><dd id="display-name">Loading…</dd><dt>Email</dt><dd id="email-address">Loading…</dd><dt>Password</dt><dd>•••••••• <span class="muted">(hidden for security)</span></dd></dl>
  <form id="password-form"><h2>Change password</h2><label for="new-password">New password</label><input id="new-password" name="password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update password</button></form>
  <p id="message" class="message" role="status"></p><button id="signout" class="secondary" type="button">Log out</button>
</main>
<script type="module">
  import { supabase } from "./supabase.js";
  const message = document.getElementById("message");
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error || !session) window.location.replace("login.html");
  else {
    document.getElementById("display-name").textContent = session.user.user_metadata?.display_name || "Not set";
    document.getElementById("email-address").textContent = session.user.email || "Not available";
  }
  document.getElementById("password-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = new FormData(event.currentTarget).get("password");
    const { error } = await supabase.auth.updateUser({ password });
    message.textContent = error ? error.message : "Password updated.";
    if (!error) event.currentTarget.reset();
  });
  document.getElementById("signout").addEventListener("click", async () => {
    const { error } = await supabase.auth.signOut();
    if (error) message.textContent = error.message;
    else window.location.replace("login.html");
  });
  supabase.auth.onAuthStateChange((_event, nextSession) => {
    if (!nextSession) window.location.replace("login.html");
  });
</script></body></html>
