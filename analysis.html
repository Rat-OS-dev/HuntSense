<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis · HuntSense</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-page">
  <div class="app-shell">
    <aside class="app-sidebar" aria-label="Main navigation">
      <a class="sidebar-brand" href="index.html">HuntSense</a>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="index.html"><span class="nav-dot"></span>My Videos</a>
        <a class="sidebar-link is-active" href="analysis.html" aria-current="page"><span class="nav-dot"></span>Analysis</a>
      </nav>
      <a class="sidebar-account" href="account.html">Account <span aria-hidden="true">↗</span></a>
    </aside>

    <main class="app-main analysis-main">
      <div class="analysis-heading">
        <div>
          <p class="eyebrow">HUNTSENSE</p>
          <h1>Analysis</h1>
          <p class="analysis-subtitle">Your gameplay insights will live here.</p>
        </div>
        <a class="outline-link" href="index.html">My Videos <span aria-hidden="true">→</span></a>
      </div>
    </main>
  </div>

  <script type="module">
    import { supabase } from "./supabase.js";

    const { data: { session }, error } = await supabase.auth.getSession();
    if (error || !session) {
      window.location.replace("login.html");
    } else {
      supabase.auth.onAuthStateChange((_event, nextSession) => {
        if (!nextSession) window.location.replace("login.html");
      });
    }
  </script>
</body>
</html>
