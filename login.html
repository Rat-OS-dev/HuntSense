<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in · HuntSense</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-card">
  <h1>HuntSense</h1><h2>Log in</h2>
  <form id="login-form">
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <p id="message" class="message" role="status"></p><p>New here? <a href="signup.html">Create an account</a></p>
</main>
<script type="module">
  import { supabase } from "./supabase.js";
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.replace("index.html");
  document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const values = new FormData(event.currentTarget);
    const button = event.currentTarget.querySelector("button");
    const message = document.getElementById("message");
    button.disabled = true; message.textContent = "Signing in…";
    const { error } = await supabase.auth.signInWithPassword({ email: values.get("email"), password: values.get("password") });
    button.disabled = false;
    if (error) message.textContent = error.message;
    else window.location.replace("index.html");
  });
</script></body></html>
