<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HuntSense</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <header class="topbar"><a class="account-link" href="account.html">Account</a></header>
  <main class="home-content" aria-label="HuntSense home">
    <section class="videos-section" aria-labelledby="videos-heading">
      <div class="section-heading">
        <div>
          <h1 id="videos-heading">My videos</h1>
          <p class="muted">Your uploaded gameplay clips, saved privately to your account.</p>
        </div>
        <button class="add-video-button" id="choose-video" type="button" aria-label="Add a video" title="Add a video">+</button>
        <input id="video-file" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" hidden>
      </div>
      <p class="upload-note">MP4, WebM, or MOV · Up to 50 MB per video</p>
      <p class="message" id="video-message" role="status" aria-live="polite"></p>
      <div class="video-list" id="video-list">
        <p class="empty-videos">Loading your videos…</p>
      </div>
    </section>
  </main>

  <div class="player-modal" id="player-modal" hidden role="dialog" aria-modal="true" aria-labelledby="player-title">
    <div class="player-backdrop" data-close-player></div>
    <section class="player-panel">
      <div class="player-heading">
        <div><p class="eyebrow">HUNTSENSE PLAYER</p><h2 id="player-title">Your video</h2></div>
        <button class="player-close" type="button" data-close-player aria-label="Close player">×</button>
      </div>
      <video id="main-player" controls playsinline></video>
    </section>
  </div>
  <script type="module">
    import { supabase } from "./supabase.js";

    const BUCKET = "huntsense-videos";
    const MAX_FILE_SIZE = 50 * 1024 * 1024;
    const chooseButton = document.querySelector("#choose-video");
    const fileInput = document.querySelector("#video-file");
    const videoList = document.querySelector("#video-list");
    const message = document.querySelector("#video-message");
    const playerModal = document.querySelector("#player-modal");
    const mainPlayer = document.querySelector("#main-player");
    const playerTitle = document.querySelector("#player-title");
    function openVideo(url, title) {
      playerTitle.textContent = title; mainPlayer.src = url;
      playerModal.hidden = false; document.body.classList.add("player-open");
      mainPlayer.play().catch(() => {});
    }
    function closeVideo() {
      mainPlayer.pause(); mainPlayer.removeAttribute("src"); mainPlayer.load();
      playerModal.hidden = true; document.body.classList.remove("player-open");
    }
    playerModal.querySelectorAll("[data-close-player]").forEach(el => el.addEventListener("click", closeVideo));
    document.addEventListener("keydown", event => { if (event.key === "Escape" && !playerModal.hidden) closeVideo(); });

    const { data: { session }, error: sessionError } = await supabase.auth.getSession();
    if (sessionError || !session) {
      window.location.replace("login.html");
    } else {
      supabase.auth.onAuthStateChange((_event, nextSession) => {
        if (!nextSession) window.location.replace("login.html");
      });
      await loadVideos(session.user.id);
    }

    chooseButton.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      message.textContent = "";

      const allowedTypes = ["video/mp4", "video/webm", "video/quicktime"];
      if (!allowedTypes.includes(file.type)) {
        message.textContent = "Please choose an MP4, WebM, or MOV video.";
        fileInput.value = "";
        return;
      }
      if (file.size > MAX_FILE_SIZE) {
        message.textContent = "That video is over the 50 MB upload limit.";
        fileInput.value = "";
        return;
      }

      chooseButton.disabled = true;
      chooseButton.textContent = "…";
      message.textContent = "Uploading your video…";

      try {
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const objectPath = `${session.user.id}/${crypto.randomUUID()}-${safeName}`;
        const { error: uploadError } = await supabase.storage
          .from(BUCKET)
          .upload(objectPath, file, {
            cacheControl: "3600",
            contentType: file.type,
            upsert: false
          });

        if (uploadError) throw uploadError;
        message.textContent = "Video uploaded successfully.";
        await loadVideos(session.user.id);
      } catch (error) {
        message.textContent = error.message || "The video could not be uploaded. Please try again.";
      } finally {
        chooseButton.disabled = false;
        chooseButton.textContent = "+";
        fileInput.value = "";
      }
    });

    async function loadVideos(userId) {
      videoList.replaceChildren();
      const { data: files, error } = await supabase.storage
        .from(BUCKET)
        .list(userId, {
          limit: 100,
          sortBy: { column: "created_at", order: "desc" }
        });

      if (error) {
        videoList.textContent = "Could not load your videos: " + error.message;
        return;
      }

      const videos = (files || []).filter(file => file.name && file.name !== ".emptyFolderPlaceholder");
      if (!videos.length) {
        const empty = document.createElement("p");
        empty.className = "empty-videos";
        empty.textContent = "No videos yet. Click the + button to upload your first clip.";
        videoList.append(empty);
        return;
      }

      for (const file of videos) {
        const path = userId + "/" + file.name;
        const { data: signed, error: urlError } = await supabase.storage.from(BUCKET).createSignedUrl(path, 60 * 60);
        const tile = document.createElement("button"); tile.type = "button"; tile.className = "video-tile";
        tile.disabled = !!urlError || !signed?.signedUrl; tile.setAttribute("aria-label", "Play " + file.name);
        const poster = document.createElement("video"); poster.className = "video-tile-preview";
        poster.muted = true; poster.playsInline = true; poster.preload = "metadata";
        if (!urlError && signed?.signedUrl) poster.src = signed.signedUrl;
        const playMark = document.createElement("span"); playMark.className = "tile-play-mark";
        playMark.setAttribute("aria-hidden", "true"); playMark.textContent = "▶";
        const meta = document.createElement("span"); meta.className = "video-tile-meta";
        const name = document.createElement("strong"); name.className = "video-name"; name.textContent = file.name.replace(/^[0-9a-f-]+-/i, "");
        const date = document.createElement("small"); date.textContent = file.created_at ? new Date(file.created_at).toLocaleDateString() : "Uploaded clip";
        meta.append(name, date); tile.append(poster, playMark, meta);
        if (!urlError && signed?.signedUrl) tile.addEventListener("click", () => openVideo(signed.signedUrl, name.textContent));
        videoList.append(tile);
      }
    }
  </script>
</body>
</html>
