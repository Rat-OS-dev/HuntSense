<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HuntSense</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <header class="topbar"><a class="account-link" href="account.html">Account</a></header>
  <main aria-label="HuntSense home"></main>
  <script type="module">
    import { supabase } from "./supabase.js";
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error || !session) window.location.replace("login.html");
    supabase.auth.onAuthStateChange((_event, nextSession) => {
      if (!nextSession) window.location.replace("login.html");
    });
  </script>
</body>
</html>
